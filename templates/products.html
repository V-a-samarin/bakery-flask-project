{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Управление продукцией</h2></div>
<form class="row g-2 mb-3">
<div class="col-md-5"><input class="form-control" name="q" value="{{q}}" placeholder="Поиск по названию или категории"></div>
<div class="col-md-2"><button class="btn btn-dark">Поиск</button></div>
</form>
<div class="card p-3 mb-4"><h5>Добавить товар</h5>
<form method="post" class="row g-2">
<div class="col-md-3"><input class="form-control" name="name" placeholder="Название" required></div>
<div class="col-md-2"><input class="form-control" name="category" placeholder="Категория" required></div>
<div class="col-md-2"><input class="form-control" name="price" type="number" step="0.01" placeholder="Цена" required></div>
<div class="col-md-2"><input class="form-control" name="quantity" type="number" placeholder="Количество" required></div>
<div class="col-md-2"><button class="btn btn-warning">Добавить товар</button></div>
</form></div>
<div class="card p-3"><table class="table"><thead><tr><th>№</th><th>Название</th><th>Категория</th><th>Цена</th><th>Количество</th><th></th></tr></thead>
<tbody>{% for p in products %}<tr><td>{{p.id}}</td><td>{{p.name}}</td><td>{{p.category}}</td><td>{{p.price}} ₽</td><td>{{p.quantity}}</td><td><a class="btn btn-sm btn-outline-danger" href="{{url_for('delete_product',product_id=p.id)}}">Удалить</a></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
