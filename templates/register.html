<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5"><div class="card mx-auto p-4 shadow-sm" style="max-width:520px">
<h3>Регистрация пользователя</h3>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post">
<input class="form-control mb-3" name="full_name" placeholder="ФИО" required>
<input class="form-control mb-3" name="username" placeholder="Логин" required>
<input class="form-control mb-3" type="password" name="password" placeholder="Пароль" required>
<button class="btn btn-warning">Создать аккаунт</button>
<a class="btn btn-link" href="{{url_for('login')}}">Назад</a>
</form></div></div></body></html>
