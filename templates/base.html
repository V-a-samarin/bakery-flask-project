<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Пекарня и кондитерская" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <aside class="sidebar p-3" style="width:240px;">
        <div class="brand mb-4">🍞 Пекарня</div>
        <a href="{{ url_for('dashboard') }}">Главная</a>
        <a href="{{ url_for('products') }}">Продукция</a>
        <a href="{{ url_for('clients') }}">Клиенты</a>
        <a href="{{ url_for('orders') }}">Заказы</a>
        <a href="{{ url_for('reports') }}">Отчётность</a>
        <a href="{{ url_for('employees') }}">Сотрудники</a>
        <a href="{{ url_for('settings') }}">Настройки</a>
        <a href="{{ url_for('logout') }}">Выход</a>
    </aside>
    <main class="flex-grow-1 p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} auto-hide">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
