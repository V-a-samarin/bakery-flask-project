<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page d-flex align-items-center justify-content-center">
<div class="card login-card shadow-lg p-4">
    <h3 class="text-center mb-1">Пекарня и кондитерская</h3>
    <p class="text-center text-muted mb-4">Вход администратора</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
        <label class="form-label">Логин</label>
        <input class="form-control mb-3" name="username" value="admin" required>
        <label class="form-label">Пароль</label>
        <input class="form-control mb-3" type="password" name="password" value="admin123" required>
        <button class="btn btn-warning w-100 fw-bold">Войти</button>
    </form>
    <a class="text-center mt-3" href="{{ url_for('register') }}">Зарегистрировать пользователя</a>
</div>
</body>
</html>
