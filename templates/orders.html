{% extends "base.html" %}
{% block content %}<h2 class="mb-3">Заказы</h2>
<div class="card p-3"><table class="table"><thead><tr><th>№</th><th>Клиент</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead>
<tbody>{% for o in orders %}<tr><td>{{o.id}}</td><td>{{o.client}}</td><td>{{o.date}}</td><td>{{"%.0f"|format(o.amount)}} ₽</td><td><span class="badge text-bg-secondary">{{o.status}}</span></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
