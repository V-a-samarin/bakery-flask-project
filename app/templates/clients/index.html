{% extends "base.html" %}
{% block title %}Клиенты{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Клиенты</h1>
  <a class="btn btn-primary" href="{{ url_for('clients.add') }}">Добавить клиента</a>
</div>
<table class="table table-striped">
<thead><tr><th>#</th><th>ФИО</th><th>Телефон</th><th>Email</th></tr></thead>
<tbody>{% for c in clients %}<tr><td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td></tr>
{% else %}<tr><td colspan="4" class="text-center">Нет клиентов</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
